name: Build, Test, and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: naveenkumarvelanati/hello-world-java

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Check out repository
        uses: actions/checkout@v3

      # Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Build the Java application
      - name: Build with Maven
        run: mvn clean install

      # Step 4: Test the application
      - name: Run Tests
        run: mvn test

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Check out the code
      - name: Check out repository
        uses: actions/checkout@v3

      # Step 2: Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build the Docker image
      - name: Build Docker Image
        run: |
          docker build -t $DOCKER_IMAGE_NAME .

      # Step 4: Push the Docker image to DockerHub
      - name: Push Docker Image
        run: |
          docker push $DOCKER_IMAGE_NAME

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy the application
        env:
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          ssh -i "$SERVER_KEY" -o StrictHostKeyChecking=no ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_IP }} << 'EOF'
          docker pull $DOCKER_IMAGE_NAME
          docker stop hello-world-java || true
          docker rm hello-world-java || true
          docker run -d --name hello-world-java $DOCKER_IMAGE_NAME
          EOF
