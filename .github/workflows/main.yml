name: Build, Test, and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE_NAME: naveenkumarvelanati/ccitbasic:latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code
      - name: Check out repository
        uses: actions/checkout@v3

      # Step 2: Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Build the Java application
      - name: Build with Maven
        run: mvn clean install

      # Step 4: Test the application
      - name: Run Tests
        run: mvn test

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Check out the code
      - name: Check out repository
        uses: actions/checkout@v3

      # Step 2: Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build the Docker image
      - name: Build Docker Image
        run: |
          docker build -t $DOCKER_IMAGE_NAME .

      # Step 4: Push the Docker image to DockerHub
      - name: Push Docker Image
        run: |
          docker push $DOCKER_IMAGE_NAME

  deploy:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          script: |


              docker pull nginx
              docker stop test-nginx || true
              docker rm test-nginx || true
              docker run -d -p 80:80 --name test-nginx nginx


              docker pull ccitbasic:latest
              docker stop ccitbasic || true
              docker rm ccitbasic || true
              docker run -d -p 8080:8080 --name ccitbasic naveenkumarvelanati/ccitbasic:latest
